# Kept small on purpose: this machine has little memory to spare, and this project has very little to compile.
org.gradle.jvmargs=-Xmx1024m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.caching=false
kotlin.code.style=official
